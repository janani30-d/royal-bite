<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Royal Bite | Catering & Events</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Responsive CSS -->
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>
    <!--=========================================
                LOGIN SECTION
==========================================-->

<section class="login-section">

    <div class="auth-controls">
        <button class="theme-toggle auth-theme-toggle" aria-label="Toggle dark mode">
            <i class="fa-solid fa-moon"></i>
        </button>

        <button class="rtl-toggle auth-rtl-toggle" aria-label="Toggle RTL mode">
            <i class="fa-solid fa-right-left"></i>
        </button>
    </div>

    <div class="login-container">

        <div class="login-content">

            <!-- Logo -->

            <a class="login-logo" href="index.html">

                <img src="images/logo.png" alt="Royal Bite">

            </a>

            <h2>Welcome Back</h2>

            <p>Login to your Royal Bite account</p>

            <!-- Login Form -->

            <form class="login-form" action="#">

                <!-- Email -->

                <div class="input-group">

                    <input type="email"
                           placeholder="Email Address"
                           required>

                    <i class="fa-solid fa-envelope"></i>

                </div>

                <!-- Password -->

                <div class="input-group password-box">

                    <input type="password"
                           id="password"
                           placeholder="Password"
                           required>

                    <i class="fa-solid fa-eye toggle-password"></i>

                </div>

                <!-- Remember & Forgot -->

                <div class="login-options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="forgot-password.html">

                        Forgot Password?

                    </a>

                </div>

                <!-- Login Button -->

                <button type="submit"
                        class="login-submit-btn">

                    Login

                </button>

            </form>

            <!-- Divider -->

            <div class="divider">

                <span>Or Login With</span>

            </div>

            <!-- Social Login -->

            <div class="social-buttons">

                <!-- Google -->

                <a href="#" class="google-btn">

                    <svg class="google-logo" viewBox="0 0 24 24" aria-hidden="true">

                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.4-1.1 2.7-2.3 3.5v2.9h3.7c2.2-2 3.6-5 3.6-8.5z"/>

                        <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.7-2.9c-1 .7-2.4 1.1-4.2 1.1-3.1 0-5.7-2.1-6.6-4.9H1.6v3C3.5 21.3 7.4 24 12 24z"/>

                        <path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4v-3H1.6C.6 8.2 0 10.1 0 12s.6 3.8 1.6 5.4l3.8-3z"/>

                        <path fill="#EA4335" d="M12 4.7c1.7 0 3.3.6 4.5 1.8l3.3-3.3C17.9 1.2 15.2 0 12 0 7.4 0 3.5 2.7 1.6 6.6l3.8 3C6.3 6.8 8.9 4.7 12 4.7z"/>

                    </svg>

                </a>

                <!-- Apple -->

                <a href="#" class="apple-btn">

                    <i class="fab fa-apple"></i>

                </a>

                <!-- Facebook -->

                <a href="#" class="facebook-btn">

                    <i class="fab fa-facebook-f"></i>

                </a>

            </div>

            <!-- Register Link -->

            <div class="login-register-link">

                <p>

                    Don't have an account?

                    <a href="register.html">Register</a>

                </p>

            </div>

        </div>

    </div>

</section>



<!-- Main JavaScript -->
    <script src="js/script.js"></script>

</body>


</html>
