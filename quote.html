<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Royal Bite | Catering & Events</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Responsive CSS -->
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>
    <!--==================== HEADER START ====================-->

<header class='quote-header'>
    <div class='container'>
        <a href='index.html' class='quote-logo'>
            <img src='images/logo.png' alt='Royal Bite'>
        </a>

        <div class='quote-header-actions'>
            <button class='theme-toggle' id='theme-toggle'>
                <i class='fa-solid fa-moon'></i>
            </button>

            <button class='rtl-toggle' id='rtl-toggle'>
                <i class='fa-solid fa-right-left'></i>
            </button>
        </div>
    </div>
</header>

        

    

<!--==================== HEADER END ====================-->
<section class='quote-page'>
  <div class='quote-card'>

    <div class='quote-top'>
      
      <div>
        <h2>Request Your Quote</h2>
        <p>Luxury catering for weddings, corporate events, birthdays, and private celebrations.</p>
      </div>
    </div>

    <form class='quote-form-modern'>

      <div class='input-row'>
        <div class='input-group'>
          <label>Full Name</label>
          <input type='text' placeholder='Your full name'>
        </div>

        <div class='input-group'>
          <label>Phone Number</label>
          <input type='tel' placeholder='+91 98765 43210'>
        </div>
      </div>

      <div class='input-row'>
        <div class='input-group'>
          <label>Email Address</label>
          <input type='email' placeholder='you@example.com'>
        </div>

        <div class='input-group'>
          <label>Event Type</label>
          <select>
            <option>Wedding</option>
            <option>Corporate Event</option>
            <option>Birthday Party</option>
            <option>Private Event</option>
          </select>
        </div>
      </div>

      <div class='input-row'>
        <div class='input-group'>
          <label>Event Date</label>
          <input type='date'>
        </div>

        <div class='input-group'>
          <label>Guest Count</label>
          <select>
            <option>25-50 Guests</option>
            <option>50-100 Guests</option>
            <option>100-250 Guests</option>
            <option>250+ Guests</option>
          </select>
        </div>
      </div>

      <div class='input-group'>
        <label>Event Location</label>
        <input type='text' placeholder='Venue or event location'>
      </div>

      <div class='input-group'>
        <label>Tell Us About Your Event</label>
        <textarea rows='5' placeholder='Menu preferences, service style, special requests, and other details'></textarea>
      </div>

      <button class='quote-btn-modern'>Get My Personalized Quote</button>

    </form>
  </div>
</section>


<!-- Scroll To Top -->
<button id="scrollTopBtn" class="scroll-top-btn">
    <i class="fa-solid fa-arrow-up"></i>
</button>

<!-- Main JavaScript -->
<script src="js/script.js"></script>

</body>
</html>
